name: Verify bundled Rust binary
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    container:
      image: archlinux@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the dated, signed build environment
        run: bash tools/build-env.sh
      - uses: jdx/mr-boxington-action@fba1545410bea5fdd704167667b30d8ef78a8788 # v1
        with:
          version: 1.24.1
          backend: local
          working-directory: rev
      - name: Verify original Boxflat source
        run: python -B tools/boxflat-source.py --upstream
      - name: Rebuild twice and compare with the bundled executable
        run: bash tools/reproduce-binary.sh
      - name: Write verification report
        shell: bash
        run: bash tools/binary-provenance.sh "$GITHUB_SHA" > binary-provenance.txt
      - name: Attest verified binary and report
        if: github.repository == 'crmne/omarchy-moza' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            bin/omarchy-moza
            bin/omarchy-moza-shm.exe
            binary-provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-provenance-${{ github.sha }}
          path: binary-provenance.txt
          if-no-files-found: error
