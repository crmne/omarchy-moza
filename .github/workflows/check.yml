name: Check
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    container: archlinux:latest
    steps:
      - name: Install build and Boxflat dependencies
        run: pacman -Syu --noconfirm git rust base-devel qt6-declarative python-gobject gtk4 libadwaita python-cairo python-pyserial python-yaml python-evdev python-psutil xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1
        with:
          version: 1.24.1
          working-directory: rev
      - name: Verify Boxflat snapshot
        run: python -B tools/boxflat-source.py
      - name: Rust checks
        run: |
          mbx fmt --manifest-path rev/Cargo.toml --check
          mbx test --manifest-path rev/Cargo.toml --locked
          mbx clippy --manifest-path rev/Cargo.toml --locked --all-targets -- -D warnings
      - name: Boxflat adapter checks (no hardware)
        run: GDK_BACKEND=x11 xvfb-run -a python -B -m unittest discover -s tests -v
      - name: Verify bundled executable
        run: sha256sum -c bin/omarchy-moza.sha256
